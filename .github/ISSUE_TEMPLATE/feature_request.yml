name: Feature request
description: Suggest an improvement to Excel Schedule Link.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not upload client or project files. This includes RVT/XLSX files, screenshots with project data, internal paths, and user names.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
